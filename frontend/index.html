<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Agendamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600" id="form-title">Login</h2>
        
        <div id="alert-box" class="hidden mb-4 p-3 rounded text-sm"></div>

        <form id="auth-form">
            <div id="name-field" class="hidden mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Nome</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="name" type="text" placeholder="Seu Nome">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">E-mail</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="email@exemplo.com" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Senha</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="********" required>
            </div>

            <div id="role-field" class="hidden mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="role">Tipo de Conta</label>
                <select class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="role">
                    <option value="student">Aluno</option>
                    <option value="instructor">Professor</option>
                </select>
            </div>

            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="submit" id="submit-btn">
                    Entrar
                </button>
            </div>
        </form>
        
        <div class="mt-4 text-center">
            <a href="#" id="toggle-form" class="text-sm text-blue-500 hover:text-blue-800">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
